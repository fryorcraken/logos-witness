# Phase-1 CI canary. Catches regressions in:
#   - core module nix build (.#lgx and .#lib)
#   - exposed Q_INVOKABLE surface (lm metadata + methods sanity)
#   - protobuf wire schema round-trip (ctest)
#   - README staying current with user-facing surface changes (SPEC §7.5)
#
# Phases that haven't shipped yet add their own gates as they land:
#   - Phase 5+: lgpm install + logoscore round-trip (needs alice/bob profiles)
#   - Phase 9: full SPEC §9 pipeline (release artefacts via lgs build-portable)
#
# Shipped gates:
#   - Phase 4.1/4.2: exif_strip ctest target + exiftool_residual_gate
#     (exiftool comes from metadata.json nix.packages.build, picked up by
#     `nix develop` automatically — no extra step needed below).
#
# This canary intentionally does NOT run `lgs basecamp setup` yet — that
# build chain (basecamp + spel + lgpm) is multi-minute and adds nothing to
# the regression signal until there's a backend integration to exercise.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-gate:
    name: README docs gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require README update when user-facing surface changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          echo "Changed files:"; printf '  %s\n' $changed

          surface_touched=false
          readme_touched=false

          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              README.md)              readme_touched=true ;;
              scaffold.toml|*/metadata.json|*_interface.h|logos-witness-core/proto/*|*/flake.nix|*/CMakeLists.txt)
                                       surface_touched=true ;;
            esac
          done <<EOF
          $changed
          EOF

          if $surface_touched && ! $readme_touched; then
            echo "::error::User-facing surface changed (scaffold.toml / metadata.json / *_interface.h / proto/ / flake.nix / CMakeLists.txt) but README.md was not updated. See SPEC §7.5 — README is part of the contract; \"docs in a follow-up PR\" is not acceptable."
            exit 1
          fi
          echo "OK"

  build:
    name: Build + test (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Build core module .#lgx
        working-directory: logos-witness-core
        run: nix build '.#lgx' --print-build-logs

      - name: Build core module .#lib
        working-directory: logos-witness-core
        run: nix build '.#lib' --out-link result-lib --print-build-logs

      - name: Build UI module .#lgx
        working-directory: logos-witness-ui-qml
        run: nix build '.#lgx' --print-build-logs

      - name: Build UI module .#lib
        working-directory: logos-witness-ui-qml
        # `.#lib` produces the raw .so + replica factory before they're
        # packaged into the .lgx — exactly the artifact `lm metadata`
        # and `lm methods` inspect. Without it we'd be checking the
        # core plugin's surface only and would have missed (e.g.) a
        # SLOT rename on the UI's .rep file going out unnoticed.
        run: nix build '.#lib' --out-link result-lib --print-build-logs

      - name: Verify all QML files are bundled
        working-directory: logos-witness-ui-qml
        run: |
          set -eu
          # Catch the failure mode where a new qml/ *.qml is added but
          # not git-tracked: the flake `src = ./.;` then silently drops it
          # and basecamp loads a UI without the new component. Post-2.2
          # the view directory is qml/ (metadata.json → "view: qml/Main.qml")
          # and the module builder copies that directory wholesale into the
          # bundle. Exclude tests/ and the vendored Qt subtrees under qml/
          # — only top-level qml/*.qml is meant for direct view loading.
          tracked=$(git ls-files 'qml/*.qml' | awk -F/ 'NF==2' | xargs -n1 basename | sort)
          bundled=$(tar tf result/*.lgx | grep -E 'qml/[^/]+\.qml$' | xargs -n1 basename | sort -u)
          echo "Tracked QML: $tracked"
          echo "Bundled QML: $bundled"
          diff <(echo "$tracked") <(echo "$bundled")

      - name: Verify hybrid UI bundle contains the C++ backend .so
        working-directory: logos-witness-ui-qml
        run: |
          set -eu
          # `logos_witness_ui_qml` is a hybrid `ui_qml + C++ backend`
          # module — the QML view and the native plugin ship in the
          # same .lgx. If the build drops the .so (mkLogosQmlModule
          # regression, metadata.json `main` field cleared by mistake,
          # cross-compilation gap, …), runtime QML would silently
          # fall back to the bridge-only path and any task-#27 typed-
          # method migration would crash with "no backend". Catch the
          # packaging gap here, not at the user's machine.
          main_plugin=$(jq -r '.main // empty' metadata.json)
          test -n "$main_plugin" || {
            echo "::error::metadata.json missing 'main' field — hybrid UI requires it"
            exit 1
          }
          expected="${main_plugin}.so"
          found=$(tar tf result/*.lgx | grep -E "/${expected}\$" || true)
          test -n "$found" || {
            echo "::error::UI bundle missing C++ backend (expected file matching */${expected})"
            echo "bundle contents:"
            tar tf result/*.lgx
            exit 1
          }
          echo "Found C++ backend in bundle: $found"

      - name: qmltest — UI helper unit tests (Phase 3.3+)
        working-directory: logos-witness-ui-qml
        run: |
          # Use `nix shell nixpkgs#…` (flake form) rather than `nix-shell -p`
          # so we don't depend on $NIX_PATH containing <nixpkgs> — the GHA
          # nix-action only installs flake support, not channels.
          # QML2_IMPORT_PATH is derived from qtdeclarative's qml/ dir so the
          # QtTest module is discoverable; resolved at run time via $(nix
          # eval) for a single deterministic store path (no `find` glob).
          QTDECL=$(nix eval --raw nixpkgs#qt6.qtdeclarative)
          export QML2_IMPORT_PATH="$QTDECL/lib/qt-6/qml"
          export QT_QPA_PLATFORM=offscreen
          nix shell nixpkgs#qt6.qtdeclarative nixpkgs#qt6.qtbase \
            --command qmltestrunner -input tests/

      - name: Build lm inspection tool
        working-directory: logos-witness-core
        run: nix build 'github:logos-co/logos-module/tutorial-v1#lm' --out-link lm-tool --print-build-logs

      - name: Inspect plugin metadata
        working-directory: logos-witness-core
        run: ./lm-tool/bin/lm metadata result-lib/lib/logos_witness_core_plugin.so

      - name: Inspect plugin methods (locked Q_INVOKABLE surface)
        working-directory: logos-witness-core
        run: ./lm-tool/bin/lm methods result-lib/lib/logos_witness_core_plugin.so

      # Same inspection for the UI plugin. Catches .rep / metadata
      # drift on the hybrid backend (SLOTs renamed, PROPs added but
      # not surfaced, dependency declarations out of sync with the
      # generated typed accessor), which is the most likely class of
      # silent regression now that QML talks to its own C++ backend
      # via QtRO. lm-tool was built above for the core check; reuse
      # it via a relative path.
      - name: Inspect UI plugin metadata
        working-directory: logos-witness-ui-qml
        run: ../logos-witness-core/lm-tool/bin/lm metadata result-lib/lib/logos_witness_ui_qml_plugin.so

      - name: Inspect UI plugin methods (locked SLOT surface)
        working-directory: logos-witness-ui-qml
        run: ../logos-witness-core/lm-tool/bin/lm methods result-lib/lib/logos_witness_ui_qml_plugin.so

      # SPEC §9 item 6 ("Headless integration — logoscore module load +
      # read-side invokables") — temporarily removed 2026-05-19. The
      # previous implementation started the daemon with `logoscore -D` in
      # foreground, so the `status` poll never fired and CI hung until
      # the 6 h GHA cap. Even with backgrounding fixed, the witness core
      # plugin declares hard deps on `storage_module` + `delivery_module`
      # (per `lm metadata`), and the bundled logoscore-cli only ships
      # `capability_module` — `load-module logos_witness_core` would fail
      # with "Cannot resolve dependencies". The deps-aware redo is
      # tracked separately; the regression risk that step used to cover
      # is partially picked up by `lm metadata` + `lm methods` above and
      # by ctest below.

      - name: ctest — core unit tests
        working-directory: logos-witness-core
        run: |
          # Build each test target explicitly. We can't use `all` because
          # the plugin target needs `logos_sdk.h` which only resolves in
          # the lgx-flake build env, not a raw `nix develop` shell. New
          # ctest binaries must be appended to this target list as they
          # land — Phase 3.4 added test_geohash and the omission silently
          # broke CI for two commits until caught here.
          nix develop --command bash -c '
            cmake -B build -GNinja \
              && cmake --build build --target test_reference_codec test_geohash test_exif_strip \
              && ctest --test-dir build --output-on-failure'
