# CI canary. Catches regressions in:
#   - our pure-compute logic: protobuf wire schema round-trip, geohash
#     decode, EXIF strip + exiftool residual gate (ctest)
#   - QML helper units (qmltest)
#   - README staying current with user-facing surface changes (SPEC §7.5)
#
# TEMPORARILY LIGHTENED (2026-06-02): the full `nix build .#lgx/.#lib` and
# the `lm metadata`/`lm methods` surface checks are DISABLED. Building the
# witness plugin realizes its `delivery_module` dependency, whose nix build
# compiles delivery's zerokit/librln chain and fetches Rust crates from
# crates.io — which 403s on the cold GitHub Actions runner (the same
# derivation builds fine locally / from a warm cache). See the comment in
# logos-witness-core/flake.nix and the upstream ask on logos-docs#226.
# Re-enable the plugin build + surface checks once a binary-cache
# substituter for the delivery closure is wired in (tracked separately).
#
# Until then CI compiles + tests OUR code only: the ctest units build in a
# plain toolchain via -DLOGOS_WITNESS_TESTS_ONLY=ON (CMakeLists skips the
# plugin target + dep realization), so no crates.io fetch happens.
#
# Phases that haven't shipped yet add their own gates as they land:
#   - Phase 5+: lgpm install + logoscore round-trip (needs alice/bob profiles)
#   - Phase 9: full SPEC §9 pipeline (release artefacts via lgs build-portable)

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-gate:
    name: README docs gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require README update when user-facing surface changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          echo "Changed files:"; printf '  %s\n' $changed

          surface_touched=false
          readme_touched=false

          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              README.md)              readme_touched=true ;;
              scaffold.toml|*/metadata.json|*_interface.h|logos-witness-core/proto/*|*/flake.nix|*/CMakeLists.txt)
                                       surface_touched=true ;;
            esac
          done <<EOF
          $changed
          EOF

          if $surface_touched && ! $readme_touched; then
            echo "::error::User-facing surface changed (scaffold.toml / metadata.json / *_interface.h / proto/ / flake.nix / CMakeLists.txt) but README.md was not updated. See SPEC §7.5 — README is part of the contract; \"docs in a follow-up PR\" is not acceptable."
            exit 1
          fi
          echo "OK"

  build:
    name: Build + test (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      # ---------------------------------------------------------------
      # DISABLED pending the delivery-module binary-cache fix (see the
      # file header): `nix build .#lgx/.#lib` for both modules, the
      # bundle-content checks, and the `lm metadata`/`lm methods` surface
      # inspection all realize the delivery_module dep → zerokit → a
      # crates.io fetch that 403s on the cold runner. Restore this block
      # as one unit when a substituter for the delivery closure lands.
      #
      #   - Build core module .#lgx / .#lib
      #   - Build UI module   .#lgx / .#lib
      #   - Verify all QML files are bundled
      #   - Verify hybrid UI bundle contains the C++ backend .so
      #   - Build lm inspection tool + lm metadata/methods on both plugins
      # ---------------------------------------------------------------

      - name: ctest — core unit tests (plain toolchain, no dep realization)
        working-directory: logos-witness-core
        run: |
          # -DLOGOS_WITNESS_TESTS_ONLY=ON makes CMakeLists configure only
          # the pure-compute ctest targets (protobuf round-trip, geohash,
          # EXIF strip + exiftool gate) and skip the plugin target + the
          # storage/delivery header realization — so this never touches
          # crates.io. Toolchain is a plain mkShell on a pinned nixpkgs
          # (the rev our flake closure already uses), NOT `nix develop`
          # (which pulls the module build env, and with it delivery).
          # New ctest binaries must be appended to the --target list.
          nix develop --impure --expr '
            let pkgs = (builtins.getFlake
                  "github:NixOS/nixpkgs/23d72dabcb3b12469f57b37170fcbc1789bd7457"
                ).legacyPackages.x86_64-linux;
            in pkgs.mkShell {
              nativeBuildInputs = [ pkgs.cmake pkgs.ninja pkgs.pkg-config
                                    pkgs.exiftool pkgs.protobuf ];
              buildInputs = [ pkgs.protobuf pkgs.libjpeg ];
            }' --command bash -c '
            set -e
            cmake -B build -GNinja -DLOGOS_WITNESS_TESTS_ONLY=ON
            cmake --build build --target test_reference_codec test_geohash test_exif_strip
            ctest --test-dir build --output-on-failure'

      - name: qmltest — UI helper unit tests (Phase 3.3+)
        working-directory: logos-witness-ui-qml
        run: |
          # Pure QML units (qmltestrunner over tests/*.qml) — independent
          # of the module build, so unaffected by the delivery dep.
          # QML2_IMPORT_PATH is derived from qtdeclarative's qml/ dir so the
          # QtTest module is discoverable; resolved at run time via $(nix
          # eval) for a single deterministic store path (no `find` glob).
          QTDECL=$(nix eval --raw nixpkgs#qt6.qtdeclarative)
          export QML2_IMPORT_PATH="$QTDECL/lib/qt-6/qml"
          export QT_QPA_PLATFORM=offscreen
          nix shell nixpkgs#qt6.qtdeclarative nixpkgs#qt6.qtbase \
            --command qmltestrunner -input tests/
