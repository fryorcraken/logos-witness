[scaffold]
version = "0.2.0"

[repos.lez]
source = "https://github.com/logos-blockchain/logos-execution-zone.git"
pin = "35d8df0d031315219f94d1546ceb862b0e5b208f"

[repos.spel]
source = "https://github.com/logos-co/spel.git"
pin = "ed3bbedb4b684645da05455d30a4a0be7cc4dfe0"

[repos.basecamp]
source = "https://github.com/logos-co/logos-basecamp"
# Pre-release tag `pre-release-b44a5cf-260` (2026-05-08). The newest
# tagged RC (`0.1.2-RC2`) shipped manifest v0.1.0 without integrity
# hashes; bumping to this pre-release unlocked the v0.2.0 manifest +
# hashes contract our installed plugin needs to register correctly.
# Also matches the qtdeclarative-6.9.2 ABI of the QtLocation we
# vendor under logos-witness-ui-qml/qml/.
pin = "b44a5cf4787fc3a5c08e157227e791aee4d48064"
build = "nix-flake"
attr = "app"

[repos.lgpm]
source = "github:logos-co/logos-package-manager"
# HEAD of `main` (2026-04-16). `tutorial-v1`, the only tagged ref, was
# from 2026-03-27 and didn't emit the v0.2.0 manifest the bumped
# basecamp expects.
pin = "9101875bc103214855bc6217834e22e66802ed86"
build = "nix-flake"
attr = "cli"

[modules.logos_witness_core]
flake = "path:./logos-witness-core#lgx"
role = "project"

[modules.logos_witness_ui_qml]
flake = "path:./logos-witness-ui-qml#lgx"
role = "project"

[wallet]
home_dir = ".scaffold/wallet"

[framework]
kind = "default"
version = "0.1.0"

[framework.idl]
spec = "lssa-idl/0.1.0"
path = "idl"

[localnet]
port = 3040
risc0_dev_mode = true

[basecamp]
port_base = 60000
port_stride = 10
