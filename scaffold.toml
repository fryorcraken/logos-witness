# Logos Witness — scaffold configuration.
#
# Mirrors the two-module pattern used by logos-battleship. Both modules are
# built and installed by `lgs basecamp install` against the basecamp commit
# pinned below. Bumping the basecamp pin is a SPEC §7.4 decision (use the
# basecamp-bundled module versions, never master HEAD).

[scaffold]
version = "0.1.1"
cache_root = "~/.cache/logos-scaffold"

[repos.lez]
url = "https://github.com/logos-blockchain/logos-execution-zone.git"
source = "https://github.com/logos-blockchain/logos-execution-zone.git"
# Pin matches the version known to work with the basecamp pin below.
# Update both pins together.
pin = "35d8df0d031315219f94d1546ceb862b0e5b208f"

[wallet]
home_dir = ".scaffold/wallet"

[framework]
kind = "default"
version = "0.1.0"

[framework.idl]
spec = "lssa-idl/0.1.0"
path = "idl"

[localnet]
port = 3040
risc0_dev_mode = true

[basecamp]
pin = "20a3ce3bebe435b778ef06cf91105c283f8d4356"
source = "https://github.com/logos-co/logos-basecamp"
lgpm_flake = ""
port_base = 60000
port_stride = 10

[basecamp.modules.logos_witness_core]
flake = "path:./logos-witness-core#lgx"
role = "project"

[basecamp.modules.logos_witness_ui_qml]
flake = "path:./logos-witness-ui-qml#lgx"
role = "project"
